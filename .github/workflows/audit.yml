name: Scheduled dependency audit

# CI skips `make audit` on Dependabot pull requests so that newly published
# advisories against the existing lockfile cannot block unrelated dependency
# bumps. This scheduled run is the compensating control: it audits the
# default branch weekly so anything that slips through surfaces within days.

'on':
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      # v4.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4
        with:
          node-version: '22'
          corepack: true
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'
      - name: Install Rust toolchain
        uses: leynos/shared-actions/.github/actions/setup-rust@f4764bea8d813b1a8f7ebc37a44907d3c3b1e0e4
      - name: Install cargo-audit
        run: cargo binstall --no-confirm cargo-audit@0.22.1
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: make audit
