name: Scheduled dependency audit

# CI skips `make audit` on Dependabot pull requests so that newly published
# advisories against the existing lockfile cannot block unrelated dependency
# bumps. This scheduled run is the compensating control: it audits the
# default branch weekly so anything that slips through surfaces within days.

'on':
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.2.21'
  CARGO_AUDIT_VERSION: '0.22.1'

jobs:
  # Scheduled work stays on a GitHub-hosted runner: it is off the developer
  # feedback path, so the queue contention that motivates the managed runners
  # does not apply to it.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      # v4.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4
        with:
          node-version: '22'
          corepack: true
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # cache-provider stays "github": this job mounts no cache of its own, so
      # the shared action is the single owner of the Cargo paths it uses.
      - name: Install Rust toolchain
        uses: leynos/shared-actions/.github/actions/setup-rust@2055f0a7aba1a9d439dd7aba1f3559416b0a08ce
      - name: Install cargo-audit
        run: |
          set -euo pipefail
          # Compare the whole version field. A substring match would accept
          # 0.22.10 for a 0.22.1 pin, and the reported program name differs
          # between `cargo audit` and `cargo-audit`, so only the last field is
          # dependable.
          installed_version() {
            cargo audit --version 2>/dev/null | awk 'NR == 1 { print $NF }'
          }
          if [ "$(installed_version)" != "$CARGO_AUDIT_VERSION" ]; then
            # Fail closed: neither strategy compiles the crate from source.
            cargo binstall --no-confirm --locked \
              --strategies crate-meta-data,quick-install \
              "cargo-audit@${CARGO_AUDIT_VERSION}"
          fi
          test "$(installed_version)" = "$CARGO_AUDIT_VERSION"
          cargo audit --version
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: make audit
