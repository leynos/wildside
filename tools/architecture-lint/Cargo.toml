[package]
name = "architecture-lint"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
camino = "1"
cap-std = "4"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
rstest = "0.26"
rstest-bdd = "0.5.0"
rstest-bdd-macros = "0.4.0"
tempfile = "3"

# The full shared lint baseline lands with #461/#462. Until then this package
# opts in to the lints that enforce the environment-seam policy (#464), so
# `clippy.toml`'s `disallowed-methods` entries are hard errors here too.
#
# `allow_attributes` and `allow_attributes_without_reason` come with it: without
# them a contributor could silence a prohibited call with a bare
# `#[allow(clippy::disallowed_methods)]`, which never warns once the site is
# migrated, instead of the `#[expect]` the policy requires.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
