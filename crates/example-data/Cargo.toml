[package]
name = "example-data"
version = "0.1.0"
edition = "2024"
description = "Deterministic example user data generation for demonstration purposes"
license = "MIT"

[dependencies]
diceware_wordlists = "1.2.3"
num-bigint = "0.4"
camino = "1"
cap-std = "4"
fake = "4.4"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1"
rstest = "0.26"
rstest-bdd = "0.5.0"
rstest-bdd-macros = { version = "0.6.0", features = ["strict-compile-time-validation"] }

[lints]
workspace = true
