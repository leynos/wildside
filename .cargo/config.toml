# Repository-wide Cargo defaults: the dev-build footprint (Concordat
# `rust-dev-build-footprint`) and the Rust build standard (Concordat
# `rust-build-defaults`). Cargo auto-discovers this file, so a bare
# `cargo build` gets them. See "Development build footprint" and "Rust build
# standard" in docs/developers-guide.md.
#
# The parallel `rustc` frontend and, on Linux, the `mold` linker are the
# defaults for every development, test, lint and typecheck build. Cargo
# selects a single `rustflags` source rather than merging them: a matching
# `[target.*]` table replaces `[build] rustflags` outright, and an assigned
# `RUSTFLAGS` replaces both. Every flag is therefore repeated in each source,
# and the Makefile and CI compose them into the `RUSTFLAGS` they assign.
# Coverage assigns `RUSTFLAGS` without them on purpose, so a measurement stays
# on the platform linker and the single-threaded frontend. Cranelift is not the
# development backend because the suite does not pass under it; the exception
# is recorded in the developers' guide.
[unstable]
embed-metadata = false

[profile.dev]
opt-level = 1          # default is 0; 1 shrinks a bit without killing compile times
debug = 0              # no debug info keeps the target tree small; see the developers' guide
debug-assertions = true
overflow-checks = true
incremental = false    # incremental state is the largest part of a dev target tree
panic = "unwind"       # keep unwinding in normal dev builds
strip = "none"         # don't strip by default for dev

[build]
rustflags = ["-Zthreads=8"]

# `mold` ships for Linux only, so the linker flag lives in a Linux-only table.
# macOS and Windows fall through to `[build] rustflags` above and keep their
# platform linker.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=8", "-Clink-arg=-fuse-ld=mold"]
